<html>
    <head>
        <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" type="text/css">
  <script src="https://js.arcgis.com/4.32/init.js"></script>
        <style>
          html, body,
          #viewDiv {
          padding: 0;
          margin: 0;
          height: 100%;
          width: 100%;
          }

          .landsdlogo {
            width: 25px;
            height: 25px;
            display: inline-flex;
            background: url(https://api.hkmapservice.gov.hk/mapapi/landsdlogo.jpg);
            background-size: 25px;
            margin-left: 4px;
            }

          .esri-attribution a {
              color: black;
          }

          .esri-attribution {
              width: auto !important;
              left: auto !important;
              background: none;
              font-size: 12px;
              font-family: sans-serif;
              color: black;
          }

          .esri-attribution__powered-by {
              display: none;
          }
        </style>
    </head>
  <body>
    <div id="viewDiv"></div>
    <div id="landsdlogo" class="landsdlogo"></div>
    </body>
    <script>
    var apikey = "3563972aa8fe4414837fb565333c5c47"; // Please replace by your own API KEY
    var basemapURL = "https://api.hkmapservice.gov.hk/ags/map/basemap/WGS84";
    var groundURL = "https://api.hkmapservice.gov.hk/ags/image/hkterrain/WGS84";
    var meshModelURL = "https://3dapi.hkmapservice.gov.hk/ags/i3s/meshmodel/WGS84/All/SceneServer";
    require([
      "esri/Map", "esri/views/SceneView",
      "esri/layers/IntegratedMeshLayer", "esri/Basemap",
      "esri/Ground", "esri/layers/TileLayer", "esri/layers/ElevationLayer",
      "esri/core/urlUtils", "esri/views/MapView", "esri/config",
      "esri/geometry/SpatialReference", "esri/geometry/Point"
    ], function(Map, SceneView, IntegratedMeshLayer, Basemap, Ground, 
      TileLayer, ElevationLayer, urlUtils,
      MapView, esriConfig, SpatialReference, Point) {
    esriConfig.request.trustedServers.push("https://api.hkmapservice.gov.hk");
    esriConfig.request.trustedServers.push("https://3dapi.hkmapservice.gov.hk");
    esriConfig.request.interceptors.push({
      before: function(params) {
        if (params.url.indexOf("https://api.hkmapservice.gov.hk") >= 0 || params.url.indexOf("https://3dapi.hkmapservice.gov.hk") >= 0) {
          if (params.requestOptions.query) {
            params.requestOptions.query.key = apikey
          } else {
            params.requestOptions.query = {
              key: apikey
            }
          }
        }
      },
      after: function(response) {
        if (!response.ssl) {
        }
      }
    });
    urlUtils.removeQueryParameters = function(a, c) {
      return a;
    }
    var basemap = new Basemap({
      baseLayers: [
        new TileLayer({
          url: basemapURL,
          copyright: "<a href='https://api.portal.hkmapservice.gov.hk/disclaimer' target='_blank'>&copy; Map information from Lands Department<div class='landsdlogo'></div></a>"
        })
      ]
    });
    var ground = new Ground({
      layers: [
        new ElevationLayer({
          url: groundURL
        })
      ]
    });

    var map = new Map({
      basemap: basemap,
      ground: ground
    });

    
    // To retrieve the Seamless API services of 3D Visualisation Map API (Tile-based models)
    for(var index=1; index<=17; index++){
        var locationUrl 
          = `https://3dapi.hkmapservice.gov.hk/ags/i3s/meshmodel/WGS84/${index}/SceneServer`
        var mySceneLayer = new IntegratedMeshLayer({
          url: locationUrl,
          layerId: 0
        });

        map.add(mySceneLayer);
      }
      

    var scene = new SceneView({
      container: "viewDiv",
      map: map,
      camera: {
        position: {
          longitude: 114.1168,
          latitude: 22.37005,
          z: 150000,
          spatialReference: {
            wkid: 3857
          }
        },
        tilt: 0,
        heading: 0
      }
    });     

    });
    </script>
  </html>
