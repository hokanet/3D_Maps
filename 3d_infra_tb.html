<html>
<head>
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" type="text/css">
  <script src="https://js.arcgis.com/4.32/init.js"></script>
  <style>
      html,
      body,
      #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      }

      #coor {
      position: absolute;
      left: 0;
      bottom: 17px;
      background-color: white;
      padding: 2px;
      border: 1px solid black;
      font-size: 12px;
      }

      #data_panel {
      position: absolute;
      right: 10px;
      top: 10px;
      background-color: blue;
      padding: 2px;
      font-size: 12px;
      box-shadow: 5px 5px 10px #888888;
      }

      #data_panel input,
      #data_panel label {
      cursor: pointer;
      }

      #data_panel th {
      text-align: left;
      }

      .landsdlogo {
      width: 25px;
      height: 25px;
      display: inline-flex;
      background: url(https://api.hkmapservice.gov.hk/mapapi/landsdlogo.jpg);
      background-size: 25px;
      margin-left: 4px;
      }

      .esri-attribution a {
          color: black;
      }

      .esri-attribution {
          width: auto !important;
          left: auto !important;
          background: none;
          font-size: 12px;
          font-family: sans-serif;
          color: black;
      }

      .esri-attribution__powered-by {
          display: none;
      }
  </style>
  </head>
  <body>
  <div id="viewDiv">
  </div>
  </body>
  <script>
  var apikey = "3563972aa8fe4414837fb565333c5c47"; // Please replace by your own API KEY
        var serviceBm = "https://api.hkmapservice.gov.hk/osm/xyz/HKCoast/WGS84";

        require(["esri/config", "esri/Map", "esri/views/MapView", "esri/layers/WebTileLayer"],
            function (esriConfig, Map, MapView, WebTileLayer) {
                esriConfig.request.interceptors.push({
                    before: function (params) {
                        if (params.url.indexOf("api.hkmapservice.gov.hk") >= 0) {
                            if (params.requestOptions.query) {
                                params.requestOptions.query.key = apikey
                            } else {
                                params.requestOptions.query = { key: apikey }
                            }
                        }
                    },
                    after: function (response) {
                        if (!response.ssl) {
                            response.ssl = true;
                        }
                    }
                });

                var baseLayer = new WebTileLayer({
                    urlTemplate: serviceBm + "/tile/{level}/{col}/{row}.png?key=" + apikey,
                    copyright: "<a href='https://api.portal.hkmapservice.gov.hk/disclaimer' target='_blank'>&copy; Map information from Lands Department<div class='landsdlogo'></div></a>"
                });

                var map = new Map({
                    layers: [baseLayer]
                });
      var scene = new SceneView({
      container: "viewDiv",
      map: map,
      camera: {
          position: {
          longitude: 114.21602,
          latitude: 21.91563,
          z: 30000,
          spatialReference: {
              wkid: 3857
          }
          },
          tilt: 55,
          heading: 0
      }
      });
      
        // To retrieve the Seamless API services of the 3D Visualization Map API (Individualized models)
        for(var index=1; index<=17; index++){
            var url 
              = `https://3dapi.hkmapservice.gov.hk/ags/i3s/individual/WGS84/${index}/InfrastructureTile/SceneServer`

            var mySceneLayer = new SceneLayer({
            url: url
            });
            map.add(mySceneLayer);
        }
      
     
      
  });

  </script>

</html>
